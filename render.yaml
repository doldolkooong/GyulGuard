services:
  - type: web
    name: gyulguard
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: local
      - key: DATABASE_URL
        value: sqlite:////tmp/gyulguard.db
